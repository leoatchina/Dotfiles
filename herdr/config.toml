# Herdr keybindings modeled after ~/.tmux.conf.
onboarding = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "alt+o"

# Help / reload / navigation surfaces
help = "prefix+?"
reload_config = "prefix+enter"
workspace_picker = "prefix+w"
goto = "prefix+tab"
detach = "prefix+d"

# Panes: Alt+[ / Alt+] split, Vim-aware Alt+Shift+H/J/K/L focus, Alt+\ closes.
focus_pane_left = ["prefix+h", "shift+left"]
focus_pane_down = ["prefix+j", "shift+down"]
focus_pane_up = ["prefix+k", "shift+up"]
focus_pane_right = ["prefix+l", "shift+right"]
split_vertical = "alt+]"
split_horizontal = "alt+["
close_pane = "alt+backslash"
swap_pane_down = "prefix+["
swap_pane_up = "prefix+]"
last_pane = "prefix+alt+."
resize_mode = "prefix+r"
resize_pane_left = "prefix+alt+h"
resize_pane_down = "prefix+alt+j"
resize_pane_up = "prefix+alt+k"
resize_pane_right = "prefix+alt+l"
zoom = "prefix+z"

# Tabs: tmux windows mapped to Herdr tabs
new_tab = "alt+shift+o"
previous_tab = "alt+shift+p"
next_tab = "alt+shift+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+alt+q"
rename_tab = "prefix+alt+r"
move_tab_previous = "prefix+alt+p"
move_tab_next = "prefix+alt+n"

# Workspaces: tmux sessions mapped to Herdr workspaces
rename_workspace = "prefix+alt+s"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"
next_workspace = "ctrl+backtick"
previous_workspace = "ctrl+~"

# Agents
next_agent = "alt+backtick"
previous_agent = "alt+~"

# Alt+| enters copy mode. Herdr has no tmux choose-buffer action for Alt+".
copy_mode = "alt+shift+backslash"

# Navigate mode uses vi keys like tmux copy/select movement.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "alt+shift+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+shift+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+shift+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+shift+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
[ui]
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "$HOME/Dotfiles/herdr/status.sh", interval_seconds = 3, timeout_seconds = 2 },
  { type = "datetime", format = "%Y-%b-%d" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " | "
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
mouse_capture = true
