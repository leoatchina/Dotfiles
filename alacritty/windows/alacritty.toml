[window]
padding = { x = 2, y = 2 }
option_as_alt = 'Both'
startup_mode = "Maximized"

[cursor]
style = { shape = "Block", blinking = "On" }

[hints]
enabled = []

[font]
size = 12

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.normal]
family = "JetBrainsMono Nerd Font"

# Windows shell configuration - use cmd.exe as default
[terminal.shell]
program = "pwsh.exe"

# Send Herdr shortcuts as CSI-u so Alt is not encoded as an ambiguous ESC prefix.
# Without these, Alt+Shift+O -> ESC O (SS3), Alt+[ -> ESC [ (CSI), Alt+] -> ESC ] (OSC),
# Alt+\ -> ESC \ (ST), etc., which herdr cannot distinguish from control sequences.
[[keyboard.bindings]]
key = "O"
mods = "Alt|Shift"
chars = "\u001b[111;4u"

[[keyboard.bindings]]
key = "P"
mods = "Alt|Shift"
chars = "\u001b[112;4u"

[[keyboard.bindings]]
key = "N"
mods = "Alt|Shift"
chars = "\u001b[110;4u"

[[keyboard.bindings]]
key = "["
mods = "Alt"
chars = "\u001b[91;3u"

[[keyboard.bindings]]
key = "]"
mods = "Alt"
chars = "\u001b[93;3u"

[[keyboard.bindings]]
key = "\\"
mods = "Alt"
chars = "\u001b[92;3u"

[[keyboard.bindings]]
key = "|"
mods = "Alt|Shift"
chars = "\u001b[92;4u"

[[keyboard.bindings]]
key = "H"
mods = "Alt|Shift"
chars = "\u001b[104;4u"

[[keyboard.bindings]]
key = "J"
mods = "Alt|Shift"
chars = "\u001b[106;4u"

[[keyboard.bindings]]
key = "K"
mods = "Alt|Shift"
chars = "\u001b[107;4u"

[[keyboard.bindings]]
key = "L"
mods = "Alt|Shift"
chars = "\u001b[108;4u"
