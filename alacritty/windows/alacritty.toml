[window]
padding = { x = 2, y = 2 }
option_as_alt = 'Both'
startup_mode = "Maximized"

[cursor]
style = { shape = "Block", blinking = "On" }

[hints]
enabled = []

# Encode Alt chords as CSI-u Alt+character events. Uppercase entries deliberately
# omit the Shift modifier in the payload so both Herdr and tmux see M-<uppercase>.
[keyboard]
bindings = [
  { key = "O", mods = "Alt|Shift", chars = "\u001b[79;3u" },
  { key = "H", mods = "Alt|Shift", chars = "\u001b[72;3u" },
  { key = "J", mods = "Alt|Shift", chars = "\u001b[74;3u" },
  { key = "K", mods = "Alt|Shift", chars = "\u001b[75;3u" },
  { key = "L", mods = "Alt|Shift", chars = "\u001b[76;3u" },
  { key = "P", mods = "Alt|Shift", chars = "\u001b[80;3u" },
  { key = "N", mods = "Alt|Shift", chars = "\u001b[78;3u" },
  { key = "U", mods = "Alt|Shift", chars = "\u001b[85;3u" },
  { key = "|", mods = "Alt|Shift", chars = "\u001b[124;3u" },
  { key = "o", mods = "Alt", chars = "\u001b[111;3u" },
  { key = "u", mods = "Alt", chars = "\u001b[117;3u" },
  { key = "[", mods = "Alt", chars = "\u001b[91;3u" },
  { key = "]", mods = "Alt", chars = "\u001b[93;3u" },
  { key = "\\", mods = "Alt", chars = "\u001b[92;3u" },
]

[font]
size = 12

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.normal]
family = "JetBrainsMono Nerd Font"

# Windows shell configuration - use cmd.exe as default
[terminal.shell]
program = "pwsh.exe"

